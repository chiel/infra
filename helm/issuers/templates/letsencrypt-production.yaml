apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: {{ .Values.email }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - http01:
          ingress:
            class: nginx
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-api-token
              key: token
          selector:
            dnsZones:
              - tailtrail.app
